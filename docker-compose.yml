services:
  postgres:
    image: postgres:16-alpine
    container_name: fss_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fss_elibrary
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fss_elibrary"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3mock:
    image: adobe/s3mock:latest
    container_name: fss_s3mock
    restart: always
    environment:
      - initialBuckets=fss-elibrary-storage
    ports:
      - "9090:9090"
      - "9191:9191"

volumes:
  postgres_data:
