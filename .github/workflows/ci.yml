name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fss_elibrary
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Monorepo Linting
        run: npm run lint

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/fss_elibrary?sslmode=disable
        run: npm run db:migrate

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/fss_elibrary?sslmode=disable
          JWT_SECRET: ci-test-secret-min-32-chars-long-for-testing
          COOKIE_SECRET: ci-cookie-secret-for-testing
          EMAIL_PROVIDER: console
        run: npm test

      - name: Verify Builds
        run: npm run build

